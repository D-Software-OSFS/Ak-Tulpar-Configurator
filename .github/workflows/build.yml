name: Mac ve Linux Build Al

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./Ak-Tulpar Configurator 10.0.0 Faz1

    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Node.js Kur (Sürüm 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linux için Eksik Sistem Paketlerini Kur (libudev)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Bağımlılıkları Yükle (Yarn)
        run: yarn install

      - name: Electron Forge ile Paketle ve Build Al (Make)
        run: yarn make

      - name: Çıktıları Yükle
        uses: actions/upload-artifact@v4
        with:
          name: cikti-${{ matrix.os }}
          path: |
            Ak-Tulpar Configurator 10.0.0 Faz1/out/make/**/*